name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          -uses: actions/upload-pages-artifact@v4

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web export
        run: CI=1 npx expo export --platform web

      # GitHub Pages serves project sites under a subpath (user.github.io/REPO/),
      # but Expo's export emits ABSOLUTE paths (/ _expo/..., /assets/...).
      # Rewrite them to relative so the app loads from the subpath.
      - name: Fix asset paths for GitHub Pages subpath
        run: |
          sed -i 's|"/_expo/|"_expo/|g; s|"/favicon.ico|"favicon.ico|g' dist/index.html
          sed -i 's|"/assets/|"assets/|g' dist/_expo/static/js/web/*.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
